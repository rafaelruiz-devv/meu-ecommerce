<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geek & Gamer Shop | Cadastro e Checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="main-header">
    <div class="container header-content">
      <a href="index.html" class="logo">
        <i class="fa-solid fa-gamepad"></i> GEEK & GAMER
      </a>
      <nav class="main-nav">
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="index.html#produtos">Produtos</a></li>
          <li><a href="carrinho.html">Carrinho</a></li>
          <li><a href="cadastro.html">Conta / Cadastro</a></li>
        </ul>
      </nav>
      <div class="nav-icons">
        <a href="carrinho.html" aria-label="Carrinho"><i class="fa-solid fa-cart-shopping" title="Carrinho"></i></a>
        <a href="cadastro.html" aria-label="Minha Conta"><i class="fa-solid fa-user" title="Minha Conta"></i></a>
      </div>
    </div>
  </header>

  <main class="container">
    <nav class="breadcrumb">
      <a href="index.html">Início</a> &gt; <a href="carrinho.html">Carrinho</a> &gt; <span>Cadastro e Checkout</span>
    </nav>

    <form class="checkout-form" action="#" method="POST">
      
      <fieldset>
        <legend><i class="fa-solid fa-user-gear"></i> 1. Dados Pessoais</legend>
        <div class="form-grid">
          <div class="form-group full-width">
            <label for="fullname">Nome Completo:*</label>
            <input type="text" id="fullname" name="fullname" required placeholder="Ex: João da Silva">
          </div>

          <div class="form-group">
            <label for="email">E-mail:*</label>
            <input type="email" id="email" name="email" required placeholder="player1@dominio.com">
          </div>

          <div class="form-group">
            <label for="cpf">CPF:*</label>
            <input type="text" id="cpf" name="cpf" required placeholder="000.000.000-00" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}">
          </div>

          <div class="form-group">
            <label for="phone">Telefone / WhatsApp:*</label>
            <input type="tel" id="phone" name="phone" required placeholder="(11) 99999-9999">
          </div>

          <div class="form-group">
            <label for="birthdate">Data de Nascimento:*</label>
            <input type="date" id="birthdate" name="birthdate" required>
          </div>

          <div class="form-group">
            <label for="password">Senha de Acesso:*</label>
            <input type="password" id="password" name="password" required minlength="6" placeholder="Mínimo 6 caracteres">
          </div>

          <div class="form-group full-width">
            <label for="avatar">Foto de Perfil / Avatar (Opcional):</label>
            <input type="file" id="avatar" name="avatar" accept="image/*">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend><i class="fa-solid fa-truck-ramp-box"></i> 2. Endereço de Entrega</legend>
        <div class="form-grid">
          <div class="form-group">
            <label for="cep">CEP:*</label>
            <input type="text" id="cep" name="cep" required placeholder="00000-000">
          </div>

          <div class="form-group full-width">
            <label for="street">Rua / Logradouro:*</label>
            <input type="text" id="street" name="street" required placeholder="Av. Paulista">
          </div>

          <div class="form-group">
            <label for="number">Número:*</label>
            <input type="text" id="number" name="number" required placeholder="1000">
          </div>

          <div class="form-group">
            <label for="complement">Complemento:</label>
            <input type="text" id="complement" name="complement" placeholder="Apto 42, Bloco B">
          </div>

          <div class="form-group">
            <label for="neighborhood">Bairro:*</label>
            <input type="text" id="neighborhood" name="neighborhood" required placeholder="Bela Vista">
          </div>

          <div class="form-group">
            <label for="city">Cidade:*</label>
            <input type="text" id="city" name="city" required placeholder="São Paulo">
          </div>

          <div class="form-group">
            <label for="state">Estado:*</label>
            <select id="state" name="state" required>
              <option value="">Selecione...</option>
              <option value="SP">São Paulo (SP)</option>
              <option value="RJ">Rio de Janeiro (RJ)</option>
              <option value="MG">Minas Gerais (MG)</option>
              <option value="PR">Paraná (PR)</option>
              <option value="RS">Rio Grande do Sul (RS)</option>
            </select>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend><i class="fa-solid fa-wallet"></i> 3. Forma de Pagamento</legend>
        <div class="payment-options">
          <label class="payment-card">
            <input type="radio" id="pay-pix" name="pagamento" value="pix" required checked>
            <i class="fa-brands fa-pix" style="font-size: 1.8rem; color: #32bcad;"></i>
            <strong>PIX (5% OFF)</strong>
          </label>

          <label class="payment-card">
            <input type="radio" id="pay-card" name="pagamento" value="cartao" required>
            <i class="fa-solid fa-credit-card" style="font-size: 1.8rem; color: var(--primary-color);"></i>
            <strong>Cartão de Crédito</strong>
          </label>

          <label class="payment-card">
            <input type="radio" id="pay-boleto" name="pagamento" value="boleto" required>
            <i class="fa-solid fa-barcode" style="font-size: 1.8rem; color: var(--secondary-color);"></i>
            <strong>Boleto Bancário</strong>
          </label>
        </div>
      </fieldset>

      <div class="terms-group">
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">Li e aceito os <strong>Termos de Uso</strong> e Políticas da Loja.*</label>
      </div>

      <button type="submit" class="btn btn-block">Concluir Cadastro e Pagar</button>
    </form>
  </main>

  <footer class="main-footer">
    <div class="container">
      <p>&copy; 2026 Geek & Gamer Shop - Todos os direitos reservados.</p>
    </div>
  </footer>

</body>
</html>
